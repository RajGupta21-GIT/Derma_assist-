# Render Infrastructure as Code (Blueprint Specification)
# Deploys Derma Assist (React Frontend + FastAPI PyTorch Backend) in 1 Unified Free Service

services:
  - type: web
    name: derma-assist
    env: python
    region: oregon
    plan: free
    buildCommand: "npm --prefix frontend install && npm --prefix frontend run build && pip install -r requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: NODE_VERSION
        value: "20.11.0"
